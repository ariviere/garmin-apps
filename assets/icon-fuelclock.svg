<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc25c"/><stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d27a"/><stop offset="1" stop-color="#e2a43f"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c97f2b"/><stop offset="1" stop-color="#9c5d1c"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".3" cy=".2" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <mask id="bite">
      <rect x="-45" y="-35" width="90" height="70" fill="#fff"/>
      <circle cx="29" cy="-15" r="11.5" fill="#000"/>
    </mask>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="51" fill="none" stroke="#2a3342" stroke-width="9"/>
  <circle cx="64" cy="64" r="51" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="224 320" transform="rotate(-90 64 64)"/>
  <g transform="translate(64 65) rotate(-24)" filter="url(#shadow)">
    <g mask="url(#bite)">
      <rect x="-31" y="-6" width="62" height="22" rx="7" fill="url(#front)"/>
      <rect x="-31" y="-14" width="62" height="24" rx="7" fill="url(#top)"/>
      <g fill="#fdebc0">
        <ellipse cx="-24" cy="-6" rx="3" ry="1.8" transform="rotate(25 -24 -6)"/>
        <ellipse cx="-14" cy="4" rx="2.8" ry="1.7" transform="rotate(-30 -14 4)"/>
        <ellipse cx="-3" cy="-8" rx="3" ry="1.8" transform="rotate(40 -3 -8)"/>
        <ellipse cx="9" cy="5" rx="2.8" ry="1.7" transform="rotate(-15 9 5)"/>
        <ellipse cx="20" cy="-2" rx="2.6" ry="1.6" transform="rotate(30 20 -2)"/>
        <ellipse cx="-9" cy="-1" rx="2" ry="1.3" transform="rotate(-45 -9 -1)"/>
        <ellipse cx="3" cy="1" rx="2" ry="1.3" transform="rotate(15 3 1)"/>
      </g>
      <g fill="#f3d3a1" stroke="#c48d4c" stroke-width=".6">
        <ellipse cx="-19" cy="-3" rx="4" ry="2.2" transform="rotate(-20 -19 -3)"/>
        <ellipse cx="14" cy="-9" rx="3.8" ry="2.1" transform="rotate(35 14 -9)"/>
      </g>
      <g fill="#c8333f">
        <circle cx="-26" cy="4" r="2.4"/><circle cx="1" cy="-3" r="2.3"/><circle cx="24" cy="6" r="2.2"/>
      </g>
      <g fill="#ff8a7a" opacity=".6">
        <circle cx="-26.8" cy="3.2" r=".8"/><circle cx=".2" cy="-3.8" r=".8"/><circle cx="23.2" cy="5.2" r=".7"/>
      </g>
      <g fill="#3d2314">
        <circle cx="-8" cy="6" r="2.1"/><circle cx="7" cy="-5" r="2"/><circle cx="16" cy="3" r="1.9"/><circle cx="-16" cy="-10" r="1.8"/>
      </g>
      <rect x="-31" y="-14" width="62" height="24" rx="7" fill="url(#gloss)"/>
    </g>
    <g fill="#e2a43f">
      <circle cx="37" cy="-12" r="1.4"/><circle cx="41" cy="-6" r="1"/><circle cx="34" cy="-20" r=".9"/>
